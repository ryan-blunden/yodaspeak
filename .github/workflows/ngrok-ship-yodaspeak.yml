name: "Build and Push Container (yodaspeak / app_3HRDkj9hcffTR80qLVE7WLP6cyR)"

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  IMAGE_REFERENCE: "registry.ship.ngrok.com/ac_3evlwoysrwsb5eomobe7ywzh5dy/app_3hrdkj9hcfftr80qlve7wlp6cyr"
  NGROK_APP_ID: "app_3HRDkj9hcffTR80qLVE7WLP6cyR"

jobs:
  build-and-push:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - uses: "actions/checkout@v6"

      - uses: "docker/login-action@v4"
        with:
          registry: "registry.ship.ngrok.com"
          username: "creg_3FqAMnbJlyZHLdGPcvYzjGAoHKG"
          password: "${{ secrets.NGROK_REGISTRY_PASSWORD_CREG_3FQAMNBJLYZHLDGPCVYZJGAOHKG }}"

      - id: "meta"
        uses: "docker/metadata-action@v6"
        with:
          images: "${{ env.IMAGE_REFERENCE }}"
          tags: |
            type=sha,format=long,prefix=

      - uses: "docker/build-push-action@v7"
        with:
          context: "."
          file: "Dockerfile"
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: "Write image reference"
        run: |
          cat <<EOF > ngrok-image.json
          {"image":"${{ steps.meta.outputs.tags }}","commit_sha":"${{ github.sha }}"}
          EOF

      - uses: "actions/upload-artifact@v7"
        with:
          name: "ngrok-compute-image"
          path: "ngrok-image.json"
