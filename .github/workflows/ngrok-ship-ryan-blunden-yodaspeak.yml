name: "Build and Push Container (ryan-blunden-yodaspeak / app_3HWZaKg8Cf5w1EOLe4fsfDTIXAP)"

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  IMAGE_REFERENCE: "registry.ship.ngrok.com/ac_3evlwoysrwsb5eomobe7ywzh5dy/app_3hwzakg8cf5w1eole4fsfdtixap"
  NGROK_APP_ID: "app_3HWZaKg8Cf5w1EOLe4fsfDTIXAP"

jobs:
  build-and-push:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        architecture: ["amd64", "arm64"]
    permissions:
      contents: "read"
    steps:
      - uses: "actions/checkout@v6"

      - uses: "docker/login-action@v4"
        with:
          registry: "registry.ship.ngrok.com"
          username: "creg_3FqAMnbJlyZHLdGPcvYzjGAoHKG"
          password: "${{ secrets.NGROK_REGISTRY_PASSWORD_CREG_3FQAMNBJLYZHLDGPCVYZJGAOHKG }}"

      - id: "meta"
        uses: "docker/metadata-action@v6"
        with:
          images: "${{ env.IMAGE_REFERENCE }}"
          tags: |
            type=sha,format=long,prefix=

      - name: "Install Railpack"
        env:
          RAILPACK_VERSION: "0.30.0"
        run: |
          mkdir -p "${RUNNER_TEMP}/railpack-bin"
          curl -fsSL https://railpack.com/install.sh | sh -s -- --bin-dir "${RUNNER_TEMP}/railpack-bin"
          echo "${RUNNER_TEMP}/railpack-bin" >> "${GITHUB_PATH}"

      - name: "Prepare Railpack build"
        env:
          NGROK_ROOT_DIRECTORY: "."
          NGROK_RAILPACK_BUILD_COMMAND: ""
          NGROK_RAILPACK_RUN_COMMAND: ""
        run: |
          args=(
            prepare "${NGROK_ROOT_DIRECTORY}"
            --plan-out "${RUNNER_TEMP}/railpack-plan.json"
            --info-out "${RUNNER_TEMP}/railpack-info.json"
            --error-missing-start
          )
          if test -n "${NGROK_RAILPACK_BUILD_COMMAND}"; then
            args+=(--build-cmd "${NGROK_RAILPACK_BUILD_COMMAND}")
          fi
          if test -n "${NGROK_RAILPACK_RUN_COMMAND}"; then
            args+=(--start-cmd "${NGROK_RAILPACK_RUN_COMMAND}")
          fi
          railpack "${args[@]}"

      - uses: "docker/setup-qemu-action@v3"

      - uses: "docker/setup-buildx-action@v4"

      - uses: "docker/build-push-action@v7"
        with:
          context: "."
          file: "${{ runner.temp }}/railpack-plan.json"
          platforms: "linux/${{ matrix.architecture }}"
          push: true
          tags: "${{ steps.meta.outputs.tags }}-${{ matrix.architecture }}"
          labels: "${{ steps.meta.outputs.labels }}"
          build-args: |
            BUILDKIT_SYNTAX=ghcr.io/railwayapp/railpack-frontend:v0.30.0
            cache-key=${{ env.NGROK_APP_ID }}-${{ matrix.architecture }}
          cache-from: "type=gha,scope=${{ env.NGROK_APP_ID }}-${{ matrix.architecture }}"
          cache-to: "type=gha,mode=max,scope=${{ env.NGROK_APP_ID }}-${{ matrix.architecture }}"

  create-manifest:
    needs: "build-and-push"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - uses: "docker/login-action@v4"
        with:
          registry: "registry.ship.ngrok.com"
          username: "creg_3FqAMnbJlyZHLdGPcvYzjGAoHKG"
          password: "${{ secrets.NGROK_REGISTRY_PASSWORD_CREG_3FQAMNBJLYZHLDGPCVYZJGAOHKG }}"

      - id: "meta"
        uses: "docker/metadata-action@v6"
        with:
          images: "${{ env.IMAGE_REFERENCE }}"
          tags: |
            type=sha,format=long,prefix=

      - uses: "docker/setup-buildx-action@v4"

      - name: "Create multi-platform image"
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.meta.outputs.tags }}" \
            "${{ steps.meta.outputs.tags }}-amd64" \
            "${{ steps.meta.outputs.tags }}-arm64"

      - name: "Write image reference"
        run: |
          cat <<EOF > ngrok-image.json
          {"image":"${{ steps.meta.outputs.tags }}","commit_sha":"${{ github.sha }}"}
          EOF

      - uses: "actions/upload-artifact@v7"
        with:
          name: "ngrok-compute-image"
          path: "ngrok-image.json"
