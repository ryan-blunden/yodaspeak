services:
  ngrok:
    image: ngrok/ngrok:3
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?}
    command: http --url=https://${NGROK_DOMAIN:?} yodaspeak:8000

  yodaspeak:
    image: ghcr.io/ryan-blunden/yodaspeak:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:8000:8000
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_ENGINE: ${DATABASE_ENGINE:-SQLITE}
      DEBUG: ${DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:?}
      TRANSLATE_SAMPLES_ENABLED: ${TRANSLATE_SAMPLES_ENABLED:-true}
      POSTGRES_DB: ${POSTGRES_DB:-yodaspeak}
      POSTGRES_USER: ${POSTGRES_USER:-yodaspeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    profiles: ["data"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yodaspeak}
      POSTGRES_USER: ${POSTGRES_USER:-yodaspeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure
    stop_grace_period: 3s
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: ["data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure
    stop_grace_period: 3s
    volumes:
      - redis:/redis

volumes:
  postgres: {}
  redis: {}
